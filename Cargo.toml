[package]
name = "domcp"
version = "0.1.0"
edition = "2024"
description = "Dockerize MCP servers for safer interaction — wraps uvx/npx/pipx commands in containers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
nix = { version = "0.29", features = ["signal", "process", "user"] }
ctrlc = "3"
