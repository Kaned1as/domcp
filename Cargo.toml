[package]
name = "domcp"
version = "0.2.0"
edition = "2024"
authors = ["Oleg `Kanedias` Chernovskiy <kanedias@house-of-maker.online>"]
description = "Dockerize MCP servers for safety: wraps uvx/npx/pipx commands in containers"
repository = "https://gitlab.com/Kanedias/domcp"
keywords = ["mcp", "docker", "security", "isolation"]
categories = ["development-tools"]
license = "GPL-3.0+"
readme = "README.md"

[badges]
gitlab = { repository = "Kanedias/domcp", branch = "master" }

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dirs = "6"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "signal", "sync"] }
which = "8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }
